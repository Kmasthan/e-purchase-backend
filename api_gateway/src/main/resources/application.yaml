spring:
  application:
    name: api_gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/authentication/**
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/users/**
        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/orders/**
server:
  port: 8080
