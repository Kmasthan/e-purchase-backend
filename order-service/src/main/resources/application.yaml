spring:
  application:
    name: order-service
  datasource:
    url: jdbc:oracle:thin:@//localhost:1522/xepdb1
    username: system
    password: password
    driver-class-name: oracle.jdbc.driver.OracleDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        format_sql: true
server:
  port: 8083
  servlet:
    context-path: /orders
