name: E-Purchase CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'staging'
      module:
        description: 'Module to build'
        required: true
        type: choice
        options:
          - auth-service
          - api_gateway
          - user_service
          - order-service
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - DEV
          - RELEASE

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Bump version and tag (RELEASE only)
        if: ${{ github.event.inputs.build_type == 'RELEASE' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          MODULE=${{ github.event.inputs.module }}
          CURRENT_VERSION=$(mvn help:evaluate -f $MODULE/pom.xml -Dexpression=project.version -q -DforceStdout)
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          NEXT_PATCH=$(echo $RELEASE_VERSION | awk -F. '{$NF=$NF+1; print}' OFS='.')
          NEXT_VERSION="${NEXT_PATCH}-SNAPSHOT"
          mvn versions:set -f $MODULE/pom.xml -DnewVersion=$RELEASE_VERSION -DgenerateBackupPoms=false
          git add $MODULE/pom.xml
          git commit -m "release: $MODULE $RELEASE_VERSION"
          git tag "$MODULE-$RELEASE_VERSION"
          mvn versions:set -f $MODULE/pom.xml -DnewVersion=$NEXT_VERSION -DgenerateBackupPoms=false
          git add $MODULE/pom.xml
          git commit -m "chore: bump $MODULE to $NEXT_VERSION"
          git push origin HEAD:${{ github.event.inputs.branch }} --tags

      - name: Build and deploy selected module
        run: mvn clean deploy -f ${{ github.event.inputs.module }}/pom.xml --settings .github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
