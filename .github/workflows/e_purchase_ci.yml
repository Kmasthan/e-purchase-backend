name: E-Purchase CI

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: true
        default: 'staging'
      module:
        description: 'Module to build'
        required: true
        type: choice
        options:
          - auth-service
          - api_gateway
          - user_service
          - order-service
      build_type:
        description: 'Build type'
        required: true
        type: choice
        options:
          - DEV
          - RELEASE

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set DEV version
        if: ${{ github.event.inputs.build_type == 'DEV' }}
        run: mvn versions:set -f ${{ github.event.inputs.module }}/pom.xml -DnewVersion=DEV-SNAPSHOT -DgenerateBackupPoms=false -DprocessParent=false

      - name: Delete existing DEV package version (DEV only)
        if: ${{ github.event.inputs.build_type == 'DEV' }}
        run: |
          MODULE=${{ github.event.inputs.module }}
          PACKAGE_NAME="com.e-purchase:${MODULE}"
          ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$PACKAGE_NAME', safe=''))")
          RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/users/Kmasthan/packages/maven/${ENCODED_NAME}/versions")
          VERSION_ID=$(echo "$RESPONSE" | jq -r 'if type == "array" then .[] | select(.name == "DEV-SNAPSHOT") | .id else empty end')
          if [ -n "$VERSION_ID" ]; then
            curl -s -X DELETE -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/users/Kmasthan/packages/maven/${ENCODED_NAME}/versions/$VERSION_ID"
            echo "Deleted existing DEV-SNAPSHOT version"
          else
            echo "No existing DEV-SNAPSHOT found, skipping delete"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and tag (RELEASE only)
        if: ${{ github.event.inputs.build_type == 'RELEASE' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          MODULE=${{ github.event.inputs.module }}
          CURRENT_VERSION=$(mvn help:evaluate -f $MODULE/pom.xml -Dexpression=project.version -q -DforceStdout)
          RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT}
          NEXT_PATCH=$(echo $RELEASE_VERSION | awk -F. '{$NF=$NF+1; print}' OFS='.')
          NEXT_VERSION="${NEXT_PATCH}-SNAPSHOT"
          mvn versions:set -f $MODULE/pom.xml -DnewVersion=$RELEASE_VERSION -DgenerateBackupPoms=false -DprocessParent=false
          git add $MODULE/pom.xml
          git commit -m "release: $MODULE $RELEASE_VERSION"
          git tag "$MODULE-$RELEASE_VERSION"
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV

      - name: Build and deploy selected module
        run: mvn clean deploy -f ${{ github.event.inputs.module }}/pom.xml --settings .github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump to next SNAPSHOT and push (RELEASE only)
        if: ${{ github.event.inputs.build_type == 'RELEASE' }}
        run: |
          MODULE=${{ github.event.inputs.module }}
          mvn versions:set -f $MODULE/pom.xml -DnewVersion=${{ env.NEXT_VERSION }} -DgenerateBackupPoms=false -DprocessParent=false
          git add $MODULE/pom.xml
          git commit -m "chore: bump $MODULE to ${{ env.NEXT_VERSION }}"
          git push origin HEAD:${{ github.event.inputs.branch }} --tags
